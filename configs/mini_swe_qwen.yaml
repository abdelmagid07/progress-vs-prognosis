# Shared mini-swe-agent model override (provider-agnostic sampling).
#
# scripts/run_mini_swe_batch.sh deep-merges, in order:
#   1. installed mini swebench.yaml
#   2. this file
#   3. config/providers/<MODEL_PROVIDER>.yaml   (vllm | azure)
#   4. runtime env: MODEL_API_BASE / MODEL_API_KEY / MODEL_NAME / seed
#
# Switch backends with MODEL_PROVIDER only — do not edit this file for Azure vs vLLM.

# Default mini container lifetime is 2h (sleep 2h). Long thinking-ON trajs
# with Azure latency often exceed that → RuntimeError when the container dies.
# 8h is per-instance, not a global budget.
#
# Default pull_timeout is 120s — too short when many large SWE-bench images
# pull in parallel (subprocess TimeoutExpired on the first worker wave).
environment:
  container_timeout: "8h"
  pull_timeout: 1800

model:
  # Placeholder; overwritten by MODEL_NAME at resolve time.
  model_name: hosted_vllm/Qwen3-8B
  model_kwargs:
    api_base: http://localhost:8000/v1   # placeholder; set MODEL_API_BASE
    api_key: EMPTY                        # placeholder; set MODEL_API_KEY
    # Qwen3 thinking-mode sampling recipe (project decision 2026-07-18).
    # top_k is provider-specific (vLLM only) — see config/providers/*.yaml.
    temperature: 0.6
    top_p: 0.95
